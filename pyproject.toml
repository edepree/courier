[project]
name = "courier"
version = "0.2.0"
description = "notifications from pluggable sources"
requires-python = ">=3.14"
dependencies = [
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "pydantic-settings[yaml]>=2.16.2",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "ty>=0.0.97",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import formatting
    "N",            # naming
    "D",            # docstrings
    "ANN",          # type annotations
    "TID",          # no relative imports
    "G", "LOG",     # logging with %-patterns
    "BLE",          # no catch-all excepts
    "S",            # no assert for validation, plus security checks
    "DTZ",          # naive datetimes
    "PGH",          # specific type: ignore codes
    "PL",           # pylint rules implemented by ruff
    "UP",           # pyupgrade: modern Python syntax
    "B",            # bugbear: likely bugs
    "SIM",          # simplifiable code
    "C4",           # comprehensions
    "PIE",          # unnecessary code
    "RET",          # return statements
    "RUF",          # ruff-specific rules
    "ASYNC",        # asyncio pitfalls
    "PT",           # pytest style
    "PERF",         # performance
    "FURB",         # refurb modernisations
    "ERA",          # commented-out code
    "T20",          # no print statements
]
ignore = [
    "ANN401",   # any is needed for pydantic "before" validators
    "D107",     # allows __init__ args in the class docstring
    "PLR2004",  # magic values
    "SIM108",   # prefer if/else blocks over ternary assignments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D", "ANN", "PLR0913"]  # Google style 3.8.2.1 exempts test docstrings; credentials are fake
"scripts/**" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
single-line-exclusions = ["typing", "collections.abc"]
force-sort-within-sections = true
case-sensitive = false
order-by-type = false
known-first-party = ["courier"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
